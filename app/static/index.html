<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <title>Finance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --rbs-navy: #0a2240;
            --rbs-navy-deep: #061731;
            --rbs-purple: #5a287d;
            --rbs-purple-fade: rgba(90, 40, 125, 0.12);
            --rbs-text: #1a1a1a;
            --rbs-muted: #5f6770;
            --rbs-line: #e3e6ea;
            --rbs-bg: #f5f6f8;
            --rbs-card: #ffffff;
            --rbs-negative: #b8002e;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--rbs-bg);
            color: var(--rbs-text);
            line-height: 1.5;
        }
        header {
            background: var(--rbs-navy);
            color: #ffffff;
            padding: 1.1rem 0;
            border-bottom: 4px solid var(--rbs-purple);
        }
        header .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }
        header .mark {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--rbs-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        header h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary .tile {
            background: var(--rbs-card);
            border: 1px solid var(--rbs-line);
            border-radius: 8px;
            padding: 1rem 1.1rem;
        }
        .summary .label {
            color: var(--rbs-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .summary .value {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--rbs-navy);
            font-variant-numeric: tabular-nums;
        }
        .card {
            background: var(--rbs-card);
            border: 1px solid var(--rbs-line);
            border-radius: 8px;
            padding: 1.2rem 1.4rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            margin: 0 0 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--rbs-navy);
            letter-spacing: 0.3px;
        }
        canvas { max-width: 100%; }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.95rem;
        }
        th, td {
            padding: 0.65rem 0.4rem;
            text-align: left;
            border-bottom: 1px solid var(--rbs-line);
        }
        th {
            color: var(--rbs-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
        }
        td.num, th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        tr.negative td.num.balance { color: var(--rbs-negative); }
        tbody tr:last-child td { border-bottom: 0; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .grid-2 .card { margin-bottom: 0; }
        @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
        #cashflow td { border-bottom: 1px solid var(--rbs-line); padding: 0.6rem 0.4rem; }
        #cashflow td.num { text-align: right; font-variant-numeric: tabular-nums; }
        #cashflow tr.total td { font-weight: 600; color: var(--rbs-navy); border-bottom: 0; }
        #cashflow tr.outflow td.num { color: var(--rbs-negative); }
        .cadence-tag {
            display: inline-block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.12rem 0.5rem;
            border-radius: 999px;
            background: var(--rbs-purple-fade);
            color: var(--rbs-purple);
            font-weight: 600;
        }
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .card-head h2 { margin: 0; }
        .btn {
            font: inherit;
            border: 1px solid var(--rbs-navy);
            background: var(--rbs-navy);
            color: #fff;
            padding: 0.35rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--rbs-navy-deep); }
        .btn-ghost {
            background: transparent;
            color: var(--rbs-navy);
        }
        .btn-ghost:hover { background: rgba(10, 34, 64, 0.06); }
        .btn-danger {
            border-color: var(--rbs-negative);
            background: transparent;
            color: var(--rbs-negative);
        }
        .btn-danger:hover { background: rgba(184, 0, 46, 0.08); }
        .row-actions { white-space: nowrap; text-align: right; }
        .row-actions .btn { margin-left: 0.3rem; padding: 0.25rem 0.6rem; font-size: 0.78rem; }
        .cell-input {
            font: inherit;
            border: 1px solid var(--rbs-line);
            border-radius: 3px;
            padding: 0.25rem 0.4rem;
            width: 100%;
            min-width: 6rem;
            background: #fff;
        }
        .cell-input.num { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="mark">F</div>
            <h1>Finance Tracker</h1>
        </div>
    </header>
    <main>
        <div class="summary" id="summary"></div>
        <div class="card">
            <h2>Projected net wealth</h2>
            <canvas id="chart" height="120"></canvas>
        </div>
        <div class="grid-2">
            <div class="card">
                <h2>Monthly cashflow</h2>
                <table id="cashflow"><tbody></tbody></table>
            </div>
            <div class="card">
                <div class="card-head">
                    <h2>Income</h2>
                    <button class="btn" id="add-income">+ Add</button>
                </div>
                <table id="income">
                    <thead>
                        <tr>
                            <th>Source</th>
                            <th class="num">Monthly</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-head">
                <h2>Expenses</h2>
                <button class="btn" id="add-expense">+ Add</button>
            </div>
            <table id="expenses">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Cadence</th>
                        <th class="num">Amount</th>
                        <th class="num">Monthly equivalent</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="card">
            <div class="card-head">
                <h2>Accounts</h2>
                <button class="btn" id="add-account">+ Add account</button>
            </div>
            <table id="accounts">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th class="num">Balance</th>
                        <th class="num">Annual rate</th>
                        <th class="num">Monthly allocation</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <script>
        const gbp = (pence) => new Intl.NumberFormat('en-GB', {
            style: 'currency', currency: 'GBP'
        }).format(pence / 100);
        const gbpShort = (pence) => new Intl.NumberFormat('en-GB', {
            style: 'currency', currency: 'GBP', maximumFractionDigits: 0
        }).format(pence / 100);
        const monthLabel = (m) => m === 0 ? 'Now' : (m < 12 ? `${m} mo` : `${m / 12} yr`);

        function renderSummary(projections, summary) {
            const find = (m) => projections.find((p) => p.months === m);
            const today = find(0);
            const oneYear = find(12);
            const tiles = [
                { label: 'Today', value: today && gbp(today.total_pence) },
                { label: 'In 1 year', value: oneYear && gbp(oneYear.total_pence) },
                { label: 'Available to save', value: gbp(summary.available_to_save_pence) },
            ];
            const root = document.getElementById('summary');
            for (const { label, value } of tiles) {
                if (value === undefined || value === null) continue;
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerHTML = `<div class="label">${label}</div>` +
                    `<div class="value">${value}</div>`;
                root.appendChild(tile);
            }
        }

        function renderCashflow(summary) {
            const tbody = document.querySelector('#cashflow tbody');
            const rows = [
                { label: 'Income', value: summary.income_pence, cls: '' },
                { label: 'Monthly expenses', value: -summary.monthly_expense_pence, cls: 'outflow' },
                { label: 'Yearly expenses (per month)', value: -summary.yearly_monthly_equivalent_pence, cls: 'outflow' },
                { label: 'Available to save', value: summary.available_to_save_pence, cls: 'total' },
            ];
            for (const { label, value, cls } of rows) {
                const row = tbody.insertRow();
                if (cls) row.className = cls;
                row.insertCell().textContent = label;
                const cell = row.insertCell();
                cell.className = 'num';
                cell.textContent = gbp(value);
            }
        }

        function addRowActions(row, onEdit, onDelete) {
            const cell = row.insertCell();
            cell.className = 'row-actions';
            cell.innerHTML = '<button class="btn btn-ghost">Edit</button> <button class="btn btn-danger">Delete</button>';
            const [edit, del] = cell.querySelectorAll('button');
            edit.addEventListener('click', onEdit);
            del.addEventListener('click', onDelete);
        }

        function addEditActions(row, onSave, onCancel) {
            const cell = row.insertCell();
            cell.className = 'row-actions';
            cell.innerHTML = '<button class="btn">Save</button> <button class="btn btn-ghost">Cancel</button>';
            const [save, cancel] = cell.querySelectorAll('button');
            save.addEventListener('click', onSave);
            cancel.addEventListener('click', onCancel);
        }

        function renderIncomeEditRow(tbody, source, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            row.insertCell().innerHTML =
                `<input class="cell-input" type="text" value="${source?.name ?? ''}" placeholder="Source">`;
            const amt = row.insertCell();
            amt.className = 'num';
            amt.innerHTML = `<input class="cell-input num" type="number" step="0.01" value="${source ? (source.monthly_amount_pence / 100).toFixed(2) : ''}">`;
            addEditActions(
                row,
                () => {
                    const inputs = row.querySelectorAll('input');
                    onSave({
                        name: inputs[0].value.trim(),
                        monthly_amount_pence: Math.round(parseFloat(inputs[1].value || '0') * 100),
                    });
                },
                onCancel
            );
        }

        function renderIncome(sources) {
            const tbody = document.querySelector('#income tbody');
            tbody.innerHTML = '';
            for (const s of sources) {
                const row = tbody.insertRow();
                row.insertCell().textContent = s.name;
                const amt = row.insertCell();
                amt.className = 'num';
                amt.textContent = gbp(s.monthly_amount_pence);
                addRowActions(
                    row,
                    () => {
                        const insertBefore = row.nextSibling;
                        const parent = row.parentElement;
                        row.remove();
                        const tmp = document.createElement('tbody');
                        renderIncomeEditRow(
                            tmp, s,
                            async (payload) => { await apiPut(`/income/${s.id}`, payload); refresh(); },
                            () => refresh()
                        );
                        parent.insertBefore(tmp.firstElementChild, insertBefore);
                    },
                    async () => {
                        if (!confirm(`Delete income source "${s.name}"?`)) return;
                        await apiDelete(`/income/${s.id}`);
                        refresh();
                    }
                );
            }
        }

        function startAddIncome() {
            const tbody = document.querySelector('#income tbody');
            renderIncomeEditRow(
                tbody, null,
                async (payload) => { await apiPost('/income', payload); refresh(); },
                () => refresh()
            );
        }

        function renderExpenseEditRow(tbody, expense, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            row.insertCell().innerHTML =
                `<input class="cell-input" type="text" value="${expense?.name ?? ''}" placeholder="Category">`;
            row.insertCell().innerHTML =
                `<select class="cell-input">
                    <option value="monthly" ${expense?.cadence === 'monthly' ? 'selected' : ''}>monthly</option>
                    <option value="yearly" ${expense?.cadence === 'yearly' ? 'selected' : ''}>yearly</option>
                </select>`;
            const amt = row.insertCell();
            amt.className = 'num';
            amt.innerHTML = `<input class="cell-input num" type="number" step="0.01" value="${expense ? (expense.amount_pence / 100).toFixed(2) : ''}">`;
            row.insertCell().textContent = '';
            addEditActions(
                row,
                () => {
                    const name = row.querySelector('input[type=text]').value.trim();
                    const cadence = row.querySelector('select').value;
                    const amount = row.querySelector('input[type=number]').value;
                    onSave({
                        name,
                        cadence,
                        amount_pence: Math.round(parseFloat(amount || '0') * 100),
                    });
                },
                onCancel
            );
        }

        function renderExpenses(expenses) {
            const tbody = document.querySelector('#expenses tbody');
            tbody.innerHTML = '';
            for (const e of expenses) {
                const row = tbody.insertRow();
                row.insertCell().textContent = e.name;
                const cad = row.insertCell();
                cad.innerHTML = `<span class="cadence-tag">${e.cadence}</span>`;
                const amt = row.insertCell();
                amt.className = 'num';
                amt.textContent = gbp(e.amount_pence);
                const equiv = row.insertCell();
                equiv.className = 'num';
                const monthly = e.cadence === 'yearly' ? Math.round(e.amount_pence / 12) : e.amount_pence;
                equiv.textContent = gbp(monthly);
                addRowActions(
                    row,
                    () => {
                        const insertBefore = row.nextSibling;
                        const parent = row.parentElement;
                        row.remove();
                        const tmp = document.createElement('tbody');
                        renderExpenseEditRow(
                            tmp, e,
                            async (payload) => { await apiPut(`/expenses/${e.id}`, payload); refresh(); },
                            () => refresh()
                        );
                        parent.insertBefore(tmp.firstElementChild, insertBefore);
                    },
                    async () => {
                        if (!confirm(`Delete expense "${e.name}"?`)) return;
                        await apiDelete(`/expenses/${e.id}`);
                        refresh();
                    }
                );
            }
        }

        function startAddExpense() {
            const tbody = document.querySelector('#expenses tbody');
            renderExpenseEditRow(
                tbody, null,
                async (payload) => { await apiPost('/expenses', payload); refresh(); },
                () => refresh()
            );
        }

        let chartInstance = null;
        function renderChart(projections) {
            if (chartInstance) chartInstance.destroy();
            const navy = getComputedStyle(document.documentElement)
                .getPropertyValue('--rbs-purple').trim();
            const fade = getComputedStyle(document.documentElement)
                .getPropertyValue('--rbs-purple-fade').trim();
            chartInstance = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: {
                    labels: projections.map((p) => monthLabel(p.months)),
                    datasets: [{
                        label: 'Total net wealth',
                        data: projections.map((p) => p.total_pence / 100),
                        borderColor: navy,
                        backgroundColor: fade,
                        pointBackgroundColor: navy,
                        fill: true,
                        tension: 0.25,
                        borderWidth: 2,
                    }],
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: '#eef0f3' },
                            ticks: { callback: (v) => gbpShort(v * 100) },
                        },
                        x: { grid: { display: false } },
                    },
                },
            });
        }

        function accountToPayload(formRow) {
            const inputs = formRow.querySelectorAll('input');
            return {
                name: inputs[0].value.trim(),
                balance_pence: Math.round(parseFloat(inputs[1].value || '0') * 100),
                annual_rate_bp: Math.round(parseFloat(inputs[2].value || '0') * 100),
                monthly_allocation_pence: Math.round(parseFloat(inputs[3].value || '0') * 100),
            };
        }

        function renderAccountEditRow(tbody, account, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            const nameCell = row.insertCell();
            nameCell.innerHTML = `<input class="cell-input" type="text" value="${account?.name ?? ''}" placeholder="Account name">`;
            const balCell = row.insertCell();
            balCell.className = 'num';
            balCell.innerHTML = `<input class="cell-input num" type="number" step="0.01" value="${account ? (account.balance_pence / 100).toFixed(2) : ''}">`;
            const rateCell = row.insertCell();
            rateCell.className = 'num';
            rateCell.innerHTML = `<input class="cell-input num" type="number" step="0.01" value="${account ? (account.annual_rate_bp / 100).toFixed(2) : '0'}">`;
            const allocCell = row.insertCell();
            allocCell.className = 'num';
            allocCell.innerHTML = `<input class="cell-input num" type="number" step="0.01" value="${account ? (account.monthly_allocation_pence / 100).toFixed(2) : '0'}">`;
            const actionsCell = row.insertCell();
            actionsCell.className = 'row-actions';
            actionsCell.innerHTML = '<button class="btn">Save</button> <button class="btn btn-ghost">Cancel</button>';
            const [saveBtn, cancelBtn] = actionsCell.querySelectorAll('button');
            saveBtn.addEventListener('click', () => onSave(accountToPayload(row)));
            cancelBtn.addEventListener('click', onCancel);
        }

        function renderAccounts(accounts) {
            const tbody = document.querySelector('#accounts tbody');
            tbody.innerHTML = '';
            for (const a of accounts) {
                const row = tbody.insertRow();
                if (a.balance_pence < 0) row.classList.add('negative');
                row.insertCell().textContent = a.name;
                const bal = row.insertCell();
                bal.className = 'num balance';
                bal.textContent = gbp(a.balance_pence);
                const rate = row.insertCell();
                rate.className = 'num';
                rate.textContent = (a.annual_rate_bp / 100).toFixed(2) + '%';
                const alloc = row.insertCell();
                alloc.className = 'num';
                alloc.textContent = gbp(a.monthly_allocation_pence);
                const actions = row.insertCell();
                actions.className = 'row-actions';
                actions.innerHTML = '<button class="btn btn-ghost">Edit</button> <button class="btn btn-danger">Delete</button>';
                const [editBtn, deleteBtn] = actions.querySelectorAll('button');
                editBtn.addEventListener('click', () => startEditAccount(a, row));
                deleteBtn.addEventListener('click', () => deleteAccount(a));
            }
        }

        function startEditAccount(account, existingRow) {
            const tbody = existingRow.parentElement;
            const insertBefore = existingRow.nextSibling;
            existingRow.remove();
            const tempTbody = document.createElement('tbody');
            renderAccountEditRow(
                tempTbody,
                account,
                async (payload) => {
                    await apiPut(`/accounts/${account.id}`, payload);
                    await refresh();
                },
                () => refresh()
            );
            tbody.insertBefore(tempTbody.firstElementChild, insertBefore);
        }

        function startAddAccount() {
            const tbody = document.querySelector('#accounts tbody');
            renderAccountEditRow(
                tbody,
                null,
                async (payload) => {
                    await apiPost('/accounts', payload);
                    await refresh();
                },
                () => refresh()
            );
        }

        async function deleteAccount(account) {
            if (!confirm(`Delete account "${account.name}"?`)) return;
            await apiDelete(`/accounts/${account.id}`);
            await refresh();
        }

        async function apiPost(url, body) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        async function apiPut(url, body) {
            const r = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        async function apiDelete(url) {
            const r = await fetch(url, { method: 'DELETE' });
            if (!r.ok && r.status !== 204) throw new Error(await r.text());
        }

        function clearAll() {
            for (const id of ['summary', 'chart']) {
                const el = document.getElementById(id);
                if (id === 'summary') el.innerHTML = '';
            }
            for (const id of ['cashflow', 'income', 'expenses', 'accounts']) {
                document.querySelector(`#${id} tbody`).innerHTML = '';
            }
        }

        async function refresh() {
            clearAll();
            const [projections, accounts, income, expenses, summary] = await Promise.all([
                fetch('/projections').then((r) => r.json()),
                fetch('/accounts').then((r) => r.json()),
                fetch('/income').then((r) => r.json()),
                fetch('/expenses').then((r) => r.json()),
                fetch('/summary').then((r) => r.json()),
            ]);
            renderSummary(projections, summary);
            renderChart(projections);
            renderCashflow(summary);
            renderIncome(income);
            renderExpenses(expenses);
            renderAccounts(accounts);
        }

        document.getElementById('add-account').addEventListener('click', startAddAccount);
        document.getElementById('add-income').addEventListener('click', startAddIncome);
        document.getElementById('add-expense').addEventListener('click', startAddExpense);
        refresh();
    </script>
</body>
</html>
