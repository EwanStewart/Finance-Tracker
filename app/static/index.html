<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a2240">
    <title>Finance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --rbs-navy: #0a2240;
            --rbs-navy-deep: #061731;
            --rbs-purple: #5a287d;
            --rbs-purple-fade: rgba(90, 40, 125, 0.12);
            --rbs-text: #1a1a1a;
            --rbs-muted: #5f6770;
            --rbs-line: #e3e6ea;
            --rbs-bg: #f5f6f8;
            --rbs-card: #ffffff;
            --rbs-negative: #b8002e;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: var(--rbs-bg);
            color: var(--rbs-text);
            line-height: 1.5;
        }
        header {
            background: var(--rbs-navy);
            color: #ffffff;
            padding: 1.1rem 0;
            border-bottom: 4px solid var(--rbs-purple);
        }
        header .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem 3rem;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .summary .tile {
            background: var(--rbs-card);
            border: 1px solid var(--rbs-line);
            border-radius: 8px;
            padding: 1rem 1.1rem;
        }
        .summary .label {
            color: var(--rbs-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }
        .summary .value {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--rbs-navy);
            font-variant-numeric: tabular-nums;
        }
        .card {
            background: var(--rbs-card);
            border: 1px solid var(--rbs-line);
            border-radius: 8px;
            padding: 1.2rem 1.4rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            margin: 0 0 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--rbs-navy);
            letter-spacing: 0.3px;
        }
        canvas { max-width: 100%; }
        .table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 100%;
            font-size: 0.95rem;
        }
        .table-wrap > table { width: max-content; }
        th, td {
            padding: 0.65rem 0.4rem;
            text-align: left;
            border-bottom: 1px solid var(--rbs-line);
        }
        th {
            color: var(--rbs-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
        }
        td.num, th.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        tr.negative td.num.balance { color: var(--rbs-negative); }
        tbody tr:last-child td { border-bottom: 0; }
        .horizons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .horizon {
            background: var(--rbs-card);
            border: 1px solid var(--rbs-line);
            border-radius: 8px;
            padding: 0.85rem 0.95rem;
        }
        .horizon .label {
            color: var(--rbs-muted);
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            min-height: 1.2em;
        }
        .horizon .value {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--rbs-navy);
            font-variant-numeric: tabular-nums;
        }
        .horizon.custom .label { padding: 0; }
        .horizon.custom input {
            font: inherit;
            font-size: 0.85rem;
            color: var(--rbs-navy);
            background: transparent;
            border: 0;
            border-bottom: 1px dashed var(--rbs-line);
            width: 100%;
            padding: 0 0 0.15rem;
            outline: none;
        }
        .horizon.custom input:focus { border-bottom-color: var(--rbs-purple); }
        @media (max-width: 700px) {
            .horizons { grid-template-columns: repeat(2, 1fr); }
        }
        .cadence-tag {
            display: inline-block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.12rem 0.5rem;
            border-radius: 999px;
            background: var(--rbs-purple-fade);
            color: var(--rbs-purple);
            font-weight: 600;
        }
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .card-head h2 { margin: 0; }
        .btn {
            font: inherit;
            border: 1px solid var(--rbs-navy);
            background: var(--rbs-navy);
            color: #fff;
            padding: 0.35rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--rbs-navy-deep); }
        .btn-ghost {
            background: transparent;
            color: var(--rbs-navy);
        }
        .btn-ghost:hover { background: rgba(10, 34, 64, 0.06); }
        .btn-danger {
            border-color: var(--rbs-negative);
            background: transparent;
            color: var(--rbs-negative);
        }
        .btn-danger:hover { background: rgba(184, 0, 46, 0.08); }
        .row-actions { white-space: nowrap; text-align: right; }
        .row-actions .btn { margin-left: 0.3rem; padding: 0.25rem 0.6rem; font-size: 0.78rem; }
        .cell-input {
            font: inherit;
            border: 1px solid var(--rbs-line);
            border-radius: 3px;
            padding: 0.25rem 0.4rem;
            width: 100%;
            min-width: 6rem;
            background: #fff;
        }
        .cell-input.num { text-align: right; font-variant-numeric: tabular-nums; }
        .tabs {
            display: flex;
            gap: 0.25rem;
            border-bottom: 1px solid var(--rbs-line);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }
        .tabs button {
            font: inherit;
            background: transparent;
            border: 0;
            padding: 0.7rem 1rem;
            color: var(--rbs-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.92rem;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
        }
        .tabs button:hover { color: var(--rbs-navy); }
        .tabs button.active {
            color: var(--rbs-navy);
            border-bottom-color: var(--rbs-purple);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        @media (max-width: 700px) {
            main { padding: 0 1rem 2.5rem; margin-top: 1.25rem; }
            header .wrap { padding: 0 1rem; }
            header h1 { font-size: 1.05rem; }
            .card { padding: 1rem 1.1rem; margin-bottom: 1rem; }
            .summary { gap: 0.75rem; }
            .summary .value { font-size: 1.2rem; }
            .horizons { gap: 0.6rem; margin-bottom: 1.25rem; }
            .horizon { padding: 0.7rem 0.75rem; }
            .horizon .value { font-size: 1rem; }
            .horizon.custom input { font-size: 16px; }
            .tabs { gap: 0; }
            .tabs button { padding: 0.85rem 0.85rem; font-size: 0.95rem; }
            .btn { min-height: 40px; padding: 0.55rem 0.95rem; font-size: 0.9rem; }
            .row-actions .btn { min-height: 36px; padding: 0.45rem 0.75rem; }
            .card-head { flex-wrap: wrap; gap: 0.5rem; }
            .cell-input { font-size: 16px; min-width: 0; }
            /* Stacked row-cards: each table row becomes a labelled vertical list */
            .table-wrap { overflow-x: visible; }
            .table-wrap > table { width: 100%; min-width: 0; display: block; }
            .table-wrap > table > thead { display: none; }
            .table-wrap > table > tbody { display: block; }
            .table-wrap > table > tbody > tr {
                display: block;
                border: 1px solid var(--rbs-line);
                border-radius: 6px;
                padding: 0.7rem 0.85rem;
                margin-bottom: 0.6rem;
                background: var(--rbs-bg);
            }
            .table-wrap > table > tbody > tr:last-child { margin-bottom: 0; }
            .table-wrap > table > tbody > tr.editing { background: #fff; }
            .table-wrap > table > tbody > tr > td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 0.75rem;
                padding: 0.35rem 0;
                border-bottom: 1px dashed var(--rbs-line);
                white-space: normal;
                text-align: left;
            }
            .table-wrap > table > tbody > tr > td:last-child { border-bottom: 0; }
            .table-wrap > table > tbody > tr > td.num { text-align: right; }
            .table-wrap > table > tbody > tr > td::before {
                content: attr(data-label);
                color: var(--rbs-muted);
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-weight: 600;
                flex-shrink: 0;
            }
            .table-wrap > table > tbody > tr > td:not([data-label])::before { content: none; }
            .table-wrap > table > tbody > tr > td.row-actions {
                justify-content: flex-end;
                padding-top: 0.6rem;
            }
            .table-wrap > table > tbody > tr > td .cell-input { width: auto; flex: 1; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <h1>Finance Tracker</h1>
        </div>
    </header>
    <main>
        <div class="summary" id="summary"></div>
        <nav class="tabs" id="tabs">
            <button data-tab="overview" class="active">Overview</button>
            <button data-tab="accounts">Accounts</button>
            <button data-tab="income">Income</button>
            <button data-tab="expenses">Expenses</button>
        </nav>

        <section class="tab-panel active" id="tab-overview">
            <div class="horizons" id="horizons">
                <div class="horizon" data-months="1">
                    <div class="label">1 month</div>
                    <div class="value" data-value></div>
                </div>
                <div class="horizon" data-months="3">
                    <div class="label">3 months</div>
                    <div class="value" data-value></div>
                </div>
                <div class="horizon" data-months="6">
                    <div class="label">6 months</div>
                    <div class="value" data-value></div>
                </div>
                <div class="horizon" data-months="12">
                    <div class="label">1 year</div>
                    <div class="value" data-value></div>
                </div>
                <div class="horizon custom">
                    <div class="label">
                        <input id="custom-date" type="date" aria-label="Custom date">
                    </div>
                    <div class="value" id="custom-value">&mdash;</div>
                </div>
            </div>
            <div class="card">
                <h2>Projected net wealth</h2>
                <canvas id="chart" height="120"></canvas>
            </div>
        </section>

        <section class="tab-panel" id="tab-accounts">
            <div class="card">
                <div class="card-head">
                    <h2>Savings</h2>
                    <button class="btn" id="add-savings">+ Add savings</button>
                </div>
                <div class="table-wrap">
                    <table id="savings-accounts">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th class="num">Balance</th>
                                <th class="num">Annual rate</th>
                                <th class="num">Monthly allocation</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="card">
                <div class="card-head">
                    <h2>Credit cards</h2>
                    <button class="btn" id="add-credit-card">+ Add credit card</button>
                </div>
                <div class="table-wrap">
                    <table id="credit-cards">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th class="num">Balance</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="tab-panel" id="tab-income">
            <div class="card">
                <div class="card-head">
                    <h2>Income</h2>
                    <button class="btn" id="add-income">+ Add</button>
                </div>
                <div class="table-wrap">
                    <table id="income">
                        <thead>
                            <tr>
                                <th>Source</th>
                                <th class="num">Monthly</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="tab-panel" id="tab-expenses">
            <div class="card">
                <div class="card-head">
                    <h2>Monthly expenses</h2>
                    <button class="btn" id="add-monthly-expense">+ Add monthly</button>
                </div>
                <div class="table-wrap">
                    <table id="monthly-expenses">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th class="num">Amount</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
            <div class="card">
                <div class="card-head">
                    <h2>Yearly expenses</h2>
                    <button class="btn" id="add-yearly-expense">+ Add yearly</button>
                </div>
                <div class="table-wrap">
                    <table id="yearly-expenses">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th class="num">Amount</th>
                                <th class="num">Monthly equivalent</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script>
        const gbp = (pence) => new Intl.NumberFormat('en-GB', {
            style: 'currency', currency: 'GBP'
        }).format(pence / 100);
        const parseMoney = (value) => {
            const cleaned = String(value ?? '').replace(/[£$€,\s]/g, '');
            const n = parseFloat(cleaned);
            return Number.isFinite(n) ? n : 0;
        };
        const toPence = (value) => Math.round(parseMoney(value) * 100);
        const gbpShort = (pence) => new Intl.NumberFormat('en-GB', {
            style: 'currency', currency: 'GBP', maximumFractionDigits: 0
        }).format(pence / 100);
        const monthLabel = (m) => m === 0 ? 'Now' : (m < 12 ? `${m} mo` : `${m / 12} yr`);

        function renderSummary(projections) {
            const find = (m) => projections.find((p) => p.months === m);
            const today = find(0);
            const root = document.getElementById('summary');
            if (!today) return;
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = '<div class="label">Today</div>' +
                `<div class="value">${gbp(today.total_pence)}</div>`;
            root.appendChild(tile);
        }

        function renderHorizons(projections) {
            for (const el of document.querySelectorAll('.horizon[data-months]')) {
                const months = Number(el.dataset.months);
                const point = projections.find((p) => p.months === months);
                el.querySelector('[data-value]').textContent =
                    point ? gbp(point.total_pence) : '—';
            }
        }

        function monthsBetween(from, to) {
            const years = to.getFullYear() - from.getFullYear();
            const months = years * 12 + (to.getMonth() - from.getMonth());
            return Math.max(0, months);
        }

        let customDebounce;
        function setupCustomHorizon() {
            const input = document.getElementById('custom-date');
            const output = document.getElementById('custom-value');
            const today = new Date();
            const minDate = today.toISOString().slice(0, 10);
            input.min = minDate;
            input.addEventListener('change', async () => {
                clearTimeout(customDebounce);
                if (!input.value) {
                    output.textContent = '—';
                    return;
                }
                const target = new Date(input.value + 'T00:00:00');
                const months = monthsBetween(today, target);
                customDebounce = setTimeout(async () => {
                    const data = await fetch(`/projections?months=${months}`).then((r) => r.json());
                    output.textContent = data[0] ? gbp(data[0].total_pence) : '—';
                }, 100);
            });
        }

        function addRowActions(row, onEdit, onDelete) {
            const cell = row.insertCell();
            cell.className = 'row-actions';
            cell.innerHTML = '<button class="btn btn-ghost">Edit</button> <button class="btn btn-danger">Delete</button>';
            const [edit, del] = cell.querySelectorAll('button');
            edit.addEventListener('click', onEdit);
            del.addEventListener('click', onDelete);
        }

        function addEditActions(row, onSave, onCancel) {
            const cell = row.insertCell();
            cell.className = 'row-actions';
            cell.innerHTML = '<button class="btn">Save</button> <button class="btn btn-ghost">Cancel</button>';
            const [save, cancel] = cell.querySelectorAll('button');
            save.addEventListener('click', onSave);
            cancel.addEventListener('click', onCancel);
        }

        function renderIncomeEditRow(tbody, source, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            _labelledInputCell(row, 'Source', false, source?.name ?? '', 'Source');
            _labelledInputCell(row, 'Monthly', true, source ? (source.monthly_amount_pence / 100).toFixed(2) : '');
            addEditActions(
                row,
                () => {
                    const inputs = row.querySelectorAll('input');
                    onSave({
                        name: inputs[0].value.trim(),
                        monthly_amount_pence: toPence(inputs[1].value),
                    });
                },
                onCancel
            );
        }

        function renderIncome(sources) {
            const tbody = document.querySelector('#income tbody');
            tbody.innerHTML = '';
            for (const s of sources) {
                const row = tbody.insertRow();
                _labelledCell(row, 'Source', false, s.name);
                _labelledCell(row, 'Monthly', true, gbp(s.monthly_amount_pence));
                addRowActions(
                    row,
                    () => {
                        const insertBefore = row.nextSibling;
                        const parent = row.parentElement;
                        row.remove();
                        const tmp = document.createElement('tbody');
                        renderIncomeEditRow(
                            tmp, s,
                            async (payload) => { await apiPut(`/income/${s.id}`, payload); refresh(); },
                            () => refresh()
                        );
                        parent.insertBefore(tmp.firstElementChild, insertBefore);
                    },
                    async () => {
                        if (!confirm(`Delete income source "${s.name}"?`)) return;
                        await apiDelete(`/income/${s.id}`);
                        refresh();
                    }
                );
            }
        }

        function startAddIncome() {
            const tbody = document.querySelector('#income tbody');
            renderIncomeEditRow(
                tbody, null,
                async (payload) => { await apiPost('/income', payload); refresh(); },
                () => refresh()
            );
        }

        function renderExpenseEditRow(tbody, expense, cadence, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            _labelledInputCell(row, 'Category', false, expense?.name ?? '', 'Category');
            _labelledInputCell(row, 'Amount', true, expense ? (expense.amount_pence / 100).toFixed(2) : '');
            if (cadence === 'yearly') {
                const placeholder = row.insertCell();
                placeholder.setAttribute('data-label', 'Monthly equivalent');
                placeholder.className = 'num';
                placeholder.textContent = '';
            }
            addEditActions(
                row,
                () => {
                    const inputs = row.querySelectorAll('input');
                    onSave({
                        name: inputs[0].value.trim(),
                        cadence,
                        amount_pence: toPence(inputs[1].value),
                    });
                },
                onCancel
            );
        }

        function renderExpenseRow(tbody, expense) {
            const row = tbody.insertRow();
            _labelledCell(row, 'Category', false, expense.name);
            _labelledCell(row, 'Amount', true, gbp(expense.amount_pence));
            if (expense.cadence === 'yearly') {
                _labelledCell(row, 'Monthly equivalent', true, gbp(Math.round(expense.amount_pence / 12)));
            }
            addRowActions(
                row,
                () => {
                    const insertBefore = row.nextSibling;
                    const parent = row.parentElement;
                    row.remove();
                    const tmp = document.createElement('tbody');
                    renderExpenseEditRow(
                        tmp, expense, expense.cadence,
                        async (payload) => { await apiPut(`/expenses/${expense.id}`, payload); refresh(); },
                        () => refresh()
                    );
                    parent.insertBefore(tmp.firstElementChild, insertBefore);
                },
                async () => {
                    if (!confirm(`Delete expense "${expense.name}"?`)) return;
                    await apiDelete(`/expenses/${expense.id}`);
                    refresh();
                }
            );
        }

        function renderExpenses(expenses) {
            const monthlyBody = document.querySelector('#monthly-expenses tbody');
            const yearlyBody = document.querySelector('#yearly-expenses tbody');
            monthlyBody.innerHTML = '';
            yearlyBody.innerHTML = '';
            for (const e of expenses) {
                renderExpenseRow(e.cadence === 'yearly' ? yearlyBody : monthlyBody, e);
            }
        }

        function startAddExpense(cadence) {
            const selector = cadence === 'yearly' ? '#yearly-expenses tbody' : '#monthly-expenses tbody';
            const tbody = document.querySelector(selector);
            renderExpenseEditRow(
                tbody, null, cadence,
                async (payload) => { await apiPost('/expenses', payload); refresh(); },
                () => refresh()
            );
        }

        let chartInstance = null;
        function renderChart(projections) {
            if (chartInstance) chartInstance.destroy();
            const navy = getComputedStyle(document.documentElement)
                .getPropertyValue('--rbs-purple').trim();
            const fade = getComputedStyle(document.documentElement)
                .getPropertyValue('--rbs-purple-fade').trim();
            chartInstance = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: {
                    labels: projections.map((p) => monthLabel(p.months)),
                    datasets: [{
                        label: 'Total net wealth',
                        data: projections.map((p) => p.total_pence / 100),
                        borderColor: navy,
                        backgroundColor: fade,
                        pointBackgroundColor: navy,
                        fill: true,
                        tension: 0.25,
                        borderWidth: 2,
                    }],
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: '#eef0f3' },
                            ticks: { callback: (v) => gbpShort(v * 100) },
                        },
                        x: { grid: { display: false } },
                    },
                },
            });
        }

        function savingsEditPayload(row) {
            const inputs = row.querySelectorAll('input');
            return {
                name: inputs[0].value.trim(),
                balance_pence: toPence(inputs[1].value),
                annual_rate_bp: toPence(inputs[2].value),
                monthly_allocation_pence: toPence(inputs[3].value),
                kind: 'savings',
            };
        }

        function creditCardEditPayload(row) {
            const inputs = row.querySelectorAll('input');
            return {
                name: inputs[0].value.trim(),
                balance_pence: toPence(inputs[1].value),
                annual_rate_bp: 0,
                monthly_allocation_pence: 0,
                kind: 'credit_card',
            };
        }

        function _labelledInputCell(row, label, isNum, value, placeholder) {
            const cell = row.insertCell();
            cell.setAttribute('data-label', label);
            if (isNum) cell.className = 'num';
            const cls = isNum ? 'cell-input num' : 'cell-input';
            const extra = isNum ? 'inputmode="decimal" autocomplete="off"' : '';
            const ph = placeholder ? `placeholder="${placeholder}"` : '';
            cell.innerHTML = `<input class="${cls}" type="text" ${extra} value="${value ?? ''}" ${ph}>`;
        }

        function renderSavingsEditRow(tbody, account, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            _labelledInputCell(row, 'Name', false, account?.name ?? '', 'Savings name');
            _labelledInputCell(row, 'Balance', true, account ? (account.balance_pence / 100).toFixed(2) : '');
            _labelledInputCell(row, 'Annual rate', true, account ? (account.annual_rate_bp / 100).toFixed(2) : '0');
            _labelledInputCell(row, 'Monthly allocation', true, account ? (account.monthly_allocation_pence / 100).toFixed(2) : '0');
            addEditActions(row, () => onSave(savingsEditPayload(row)), onCancel);
        }

        function renderCreditCardEditRow(tbody, account, onSave, onCancel) {
            const row = tbody.insertRow();
            row.className = 'editing';
            _labelledInputCell(row, 'Name', false, account?.name ?? '', 'Card name');
            _labelledInputCell(row, 'Balance', true, account ? (account.balance_pence / 100).toFixed(2) : '');
            addEditActions(row, () => onSave(creditCardEditPayload(row)), onCancel);
        }

        function startEditAccount(account, existingRow, renderEditRowFn) {
            const tbody = existingRow.parentElement;
            const insertBefore = existingRow.nextSibling;
            existingRow.remove();
            const tmp = document.createElement('tbody');
            renderEditRowFn(
                tmp,
                account,
                async (payload) => { await apiPut(`/accounts/${account.id}`, payload); refresh(); },
                () => refresh()
            );
            tbody.insertBefore(tmp.firstElementChild, insertBefore);
        }

        async function deleteAccount(account) {
            const noun = account.kind === 'credit_card' ? 'credit card' : 'account';
            if (!confirm(`Delete ${noun} "${account.name}"?`)) return;
            await apiDelete(`/accounts/${account.id}`);
            refresh();
        }

        function _labelledCell(row, label, isNum, text, extraClass) {
            const cell = row.insertCell();
            cell.setAttribute('data-label', label);
            cell.className = (isNum ? 'num ' : '') + (extraClass || '');
            cell.textContent = text;
            return cell;
        }

        function renderSavingsRow(tbody, account) {
            const row = tbody.insertRow();
            _labelledCell(row, 'Name', false, account.name);
            _labelledCell(row, 'Balance', true, gbp(account.balance_pence), 'balance');
            _labelledCell(row, 'Annual rate', true, (account.annual_rate_bp / 100).toFixed(2) + '%');
            _labelledCell(row, 'Monthly allocation', true, gbp(account.monthly_allocation_pence));
            addRowActions(
                row,
                () => startEditAccount(account, row, renderSavingsEditRow),
                () => deleteAccount(account)
            );
        }

        function renderCreditCardRow(tbody, account) {
            const row = tbody.insertRow();
            row.classList.add('negative');
            _labelledCell(row, 'Name', false, account.name);
            _labelledCell(row, 'Balance', true, gbp(account.balance_pence), 'balance');
            addRowActions(
                row,
                () => startEditAccount(account, row, renderCreditCardEditRow),
                () => deleteAccount(account)
            );
        }

        function renderAccounts(accounts) {
            const savingsBody = document.querySelector('#savings-accounts tbody');
            const cardsBody = document.querySelector('#credit-cards tbody');
            savingsBody.innerHTML = '';
            cardsBody.innerHTML = '';
            const savings = accounts
                .filter((a) => a.kind !== 'credit_card')
                .sort((a, b) => b.balance_pence - a.balance_pence);
            const cards = accounts
                .filter((a) => a.kind === 'credit_card')
                .sort((a, b) => a.balance_pence - b.balance_pence);
            for (const a of savings) renderSavingsRow(savingsBody, a);
            for (const a of cards) renderCreditCardRow(cardsBody, a);
        }

        function startAddSavings() {
            const tbody = document.querySelector('#savings-accounts tbody');
            renderSavingsEditRow(
                tbody, null,
                async (payload) => { await apiPost('/accounts', payload); refresh(); },
                () => refresh()
            );
        }

        function startAddCreditCard() {
            const tbody = document.querySelector('#credit-cards tbody');
            renderCreditCardEditRow(
                tbody, null,
                async (payload) => { await apiPost('/accounts', payload); refresh(); },
                () => refresh()
            );
        }

        async function apiPost(url, body) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        async function apiPut(url, body) {
            const r = await fetch(url, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        async function apiDelete(url) {
            const r = await fetch(url, { method: 'DELETE' });
            if (!r.ok && r.status !== 204) throw new Error(await r.text());
        }

        function clearAll() {
            for (const id of ['summary', 'chart']) {
                const el = document.getElementById(id);
                if (id === 'summary') el.innerHTML = '';
            }
            for (const id of ['income', 'savings-accounts', 'credit-cards', 'monthly-expenses', 'yearly-expenses']) {
                document.querySelector(`#${id} tbody`).innerHTML = '';
            }
        }

        async function refresh() {
            clearAll();
            const [projections, accounts, income, expenses] = await Promise.all([
                fetch('/projections').then((r) => r.json()),
                fetch('/accounts').then((r) => r.json()),
                fetch('/income').then((r) => r.json()),
                fetch('/expenses').then((r) => r.json()),
            ]);
            renderSummary(projections);
            renderHorizons(projections);
            renderChart(projections);
            renderIncome(income);
            renderExpenses(expenses);
            renderAccounts(accounts);
        }

        function activateTab(name) {
            document.querySelectorAll('#tabs button').forEach((b) => {
                b.classList.toggle('active', b.dataset.tab === name);
            });
            document.querySelectorAll('.tab-panel').forEach((p) => {
                p.classList.toggle('active', p.id === `tab-${name}`);
            });
            if (location.hash !== `#${name}`) {
                history.replaceState(null, '', `#${name}`);
            }
        }
        document.querySelectorAll('#tabs button').forEach((b) => {
            b.addEventListener('click', () => activateTab(b.dataset.tab));
        });
        const initialTab = location.hash.replace('#', '') || 'overview';
        if (['overview', 'accounts', 'income', 'expenses'].includes(initialTab)) {
            activateTab(initialTab);
        }
        document.getElementById('add-savings').addEventListener('click', startAddSavings);
        document.getElementById('add-credit-card').addEventListener('click', startAddCreditCard);
        document.getElementById('add-income').addEventListener('click', startAddIncome);
        document.getElementById('add-monthly-expense').addEventListener('click', () => startAddExpense('monthly'));
        document.getElementById('add-yearly-expense').addEventListener('click', () => startAddExpense('yearly'));
        setupCustomHorizon();
        refresh();
    </script>
</body>
</html>
