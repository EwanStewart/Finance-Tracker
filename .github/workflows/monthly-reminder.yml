name: Monthly snapshot reminder

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send the email even if today is not the first working day"
        type: boolean
        default: false
  push:
    paths: [".github/workflows/monthly-reminder.yml"]

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder if today is the first UK working day
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.REMINDER_TO_EMAIL }}
          FORCE_SEND: ${{ inputs.force || github.event_name == 'push' }}
        run: python -m scripts.monthly_reminder
